name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate tag and version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          ver="$(lua5.1 -e 'print(dofile("script/RhythmShapes/version.lua"))')"
          if [[ "$tag" != "v$ver" ]]; then
            echo "tag $tag does not match version.lua v$ver"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 1
          fi
      - name: Parse scripts
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            luac5.1 -p "$file"
          done < <(find script tools -type f \( -name '*.lua' -o -name '*.obj2' \))
          luac5.1 -p tests/run.lua
      - name: Run tests
        run: lua5.1 tests/run.lua
      - name: Check version files
        run: lua5.1 tools/check_version.lua
      - name: Build zip
        run: python3 tools/package.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          zip="dist/RhythmShapesForAviutl2-${tag}.zip"
          test -f "$zip"
          gh release create "$tag" "$zip" \
            --title "$tag" \
            --notes-file "dist/RhythmShapesForAviutl2-${tag}.notes.md" \
            --draft
          if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "RhythmShapesForAviutl2-${tag}.zip"; then
            gh release delete "$tag" --yes
            echo "release asset missing"
            exit 1
          fi
          gh release edit "$tag" --draft=false
