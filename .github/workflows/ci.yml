name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Parse scripts
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            luac5.1 -p "$file"
          done < <(find script tools -type f \( -name '*.lua' -o -name '*.obj2' \))
          luac5.1 -p tests/run.lua
      - name: Run tests
        run: lua5.1 tests/run.lua
      - name: Check version files
        run: lua5.1 tools/check_version.lua
      - name: Verify release package
        run: python3 tools/package.py --check
